name: market-radar-weekly
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pytrends requests
      - run: python scrape_trends.py
      - run: |
          git config user.name "market-radar"
          git config user.email "radar@localhost"
          git add data/
          git diff --cached --quiet || (git commit -m "radar $(date +%F)" && git push)
